global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/PLACEHOLDER"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "slack-devops-alerts"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    - matchers:
        - severity = "critical"
      receiver: "slack-devops-alerts"
      group_wait: 10s
      repeat_interval: 4h
      continue: false

    - matchers:
        - severity = "warning"
      receiver: "slack-devops-alerts"
      group_wait: 1m
      repeat_interval: 12h
      continue: false

inhibit_rules:
  - source_matchers:
      - alertname = "ServerDown"
      - severity = "critical"
    target_matchers:
      - alertname =~ "CPUWarning|CPUCritical|MemoryWarning|MemoryCritical"
    equal:
      - instance

receivers:
  - name: "slack-devops-alerts"
    slack_configs:
      - channel: "#DevOps-Alerts"
        send_resolved: true
        icon_emoji: ":rotating_light:"
        username: "Vuln Observability"
        title: '{{ template "slack.vuln.title" . }}'
        color: '{{ template "slack.vuln.color" . }}'
        text: '{{ template "slack.vuln.text" . }}'