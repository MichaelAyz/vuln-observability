global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/PLACEHOLDER"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "slack-devops-alerts"

  routes:
    - match:
        severity: critical
      receiver: "slack-devops-alerts"
      group_wait: 10s
      repeat_interval: 4h

    - match:
        severity: warning
      receiver: "slack-devops-alerts"
      group_wait: 1m
      repeat_interval: 12h

# Inhibition: if a host is fully down, suppress CPU/memory/latency noise for that host
inhibit_rules:
  - source_match:
      alertname: "ServerDown"
      severity: "critical"
    target_match_re:
      alertname: "CPUWarning|CPUCritical|MemoryWarning|MemoryCritical"
    equal: ["instance"]

receivers:
  - name: "slack-devops-alerts"
    slack_configs:
      - channel: "#DevOps-Alerts"
        send_resolved: true
        title: '{{ template "slack.vuln.title" . }}'
        text: '{{ template "slack.vuln.text" . }}'
        color: '{{ template "slack.vuln.color" . }}'