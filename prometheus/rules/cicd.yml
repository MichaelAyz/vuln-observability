groups:
  - name: cicd
    rules:

      - alert: CFRThresholdExceeded
        expr: |
          (
            count(github_workflow_run_status{repo="hngprojects/vulnwatch-ui"} == 0)
            /
            count(github_workflow_run_status{repo="hngprojects/vulnwatch-ui"})
          ) > 0.15
          and
          count(github_workflow_run_status{repo="hngprojects/vulnwatch-ui"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Change Failure Rate exceeds 15% SLO threshold"
          description: "CFR over the last 7 days is {{ $value | humanizePercentage }} for hngprojects/vulnwatch-ui. This exceeds the 15% SLO threshold."
          runbook_url: "https://github.com/MichaelAyz/vuln-observability/blob/main/runbooks/cfr_threshold_exceeded.md"

      - alert: MTTRExceeded
        expr: |
          (
            avg(github_workflow_run_duration_ms{repo="hngprojects/vulnwatch-ui"} * on(id) (github_workflow_run_status == 1)) / 1000
          ) > 3600
          and
          avg(github_workflow_run_duration_ms{repo="hngprojects/vulnwatch-ui"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mean Time to Restore exceeds 1-hour threshold"
          description: "Average workflow restore duration is {{ $value | humanizeDuration }} for hngprojects/vulnwatch-ui. This exceeds the 1-hour MTTR threshold."
          runbook_url: "https://github.com/MichaelAyz/vuln-observability/blob/main/runbooks/mttr_exceeded.md"